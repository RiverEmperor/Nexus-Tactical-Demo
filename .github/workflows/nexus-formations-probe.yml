name: NEXUS formations source probe
on:
  push:
    paths:
      - ".github/workflows/nexus-formations-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests beautifulsoup4
      - name: Inspect public SOS Fanta page structure
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u="https://www.sosfanta.com/lista-formazioni/probabili-formazioni-serie-a/"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0 NEXUS-Tactical/1.0"},timeout=30)
          print("HTTP",r.status_code,"bytes",len(r.content))
          r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          for art in soup.find_all("article"):
              hs=[h for h in art.find_all("h2")]
              if not hs: continue
              print("ARTICLE", [h.get_text(" ",strip=True) for h in hs])
              for sec in art.find_all("section"):
                  h3=sec.find("h3",recursive=False)
                  if h3:
                      uls=sec.find_all("ul",recursive=False)
                      print("GROUP",h3.get_text(" ",strip=True),"ULS",[(len(u.find_all("li",recursive=False)),[x.get_text(" ",strip=True) for x in u.find_all("li",recursive=False)[:3]]) for u in uls])
              break
          PY