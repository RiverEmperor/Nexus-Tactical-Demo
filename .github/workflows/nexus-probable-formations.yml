name: NEXUS weekly probable formations
on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_probable_formations.py"
      - ".github/workflows/nexus-probable-formations.yml"
permissions:
  contents: write
concurrency:
  group: nexus-probable-formations
  cancel-in-progress: false
jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Download and validate probable formations
        run: python scripts/update_probable_formations.py alpha-test/formazioni.json
      - name: Publish validated feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha-test/formazioni.json
          if git diff --cached --quiet; then
            echo "Feed invariato: nessun commit necessario."
          else
            git commit -m "Aggiorna probabili formazioni Serie A"
            git fetch origin main
            git rebase origin/main
            git push origin "HEAD:main"
          fi
